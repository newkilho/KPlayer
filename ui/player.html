<html>
<body>
<div id="ui" class="hidden">
  <div id="logo">
    <div id="logo-mark">KPlayer</div>
    <div id="logo-disc"><div id="logo-play" class="ico i-play"></div></div>
  </div>

  <div id="top">
    <div id="scrim"></div>
    <div id="title"></div>
    <div id="cap-pin" class="cap"><div class="g-pin"></div></div>
    <div id="cap-min" class="cap"><div class="g-min"></div></div>
    <div id="cap-max" class="cap"><div class="g-max"></div><div class="g-res g-res1"></div><div class="g-res g-res2"></div></div>
    <div id="cap-close" class="cap"><div class="g-close"></div></div>
  </div>

  <div id="bottom">
    <div id="progress">
      <div id="track"><div id="played"></div><div id="chapters"></div></div>
      <div id="thumb"></div>
      <div id="tip"></div>
    </div>
    <div id="row">
      <div id="group" class="chip">
        <div id="btn-prev" class="btn"><div class="ico i-prev"></div></div>
        <div id="btn-play" class="btn"><div class="ico i-play"></div></div>
        <div id="btn-next" class="btn"><div class="ico i-next"></div></div>
      </div>
      <div id="vol" class="chip">
        <div id="btn-mute" class="btn"><div class="ico i-vol"></div></div>
        <div id="vol-slider"><div id="vol-track"><div id="vol-fill"></div></div><div id="vol-thumb"></div></div>
      </div>
      <div id="time" class="chip">0:00 / 0:00</div>
      <div class="spacer"></div>
      <div id="btn-sub" class="btn chip"><div class="ico i-sub"></div></div>
      <div id="btn-set" class="btn chip"><div class="ico i-set"></div></div>
      <div id="btn-list" class="btn chip"><div class="ico i-list"></div></div>
    </div>
  </div>
</div>
</body>
</html>
