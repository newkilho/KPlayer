<html>
<body>
<div id="ui" class="hidden">
  <div id="logo">
    <div id="logo-mark">KPlayer</div>
    <div id="logo-disc"><div id="logo-play" class="ico i-play"></div></div>
  </div>

  <div id="lp">
    <div id="lp-disc"><div class="g g0"></div><div class="g g1"></div><div class="g g2"></div><div class="g g3"></div><div class="g g4"></div><div class="g g5"></div><div class="g g6"></div><div class="g g7"></div></div>
    <div id="lp-label"><div id="lp-ring"></div></div>
    <div id="lp-shade"></div>
    <div id="lp-shine"></div>
    <div id="lp-hole"></div>
  </div>

  <div id="toast"></div>
  <div id="bezel"><div id="bezel-ico" class="ico"></div></div>
  <div id="bezel-pill"></div>
  <div id="alert"></div>

  <div id="top">
    <div id="scrim"></div>
    <div id="title"></div>
    <div id="cap-pin" class="cap"><div class="g-pin"></div></div>
    <div id="cap-min" class="cap"><div class="g-min"></div></div>
    <div id="cap-max" class="cap"><div class="g-max"></div><div class="g-res g-res1"></div><div class="g-res g-res2"></div></div>
    <div id="cap-close" class="cap"><div class="g-close"></div></div>
  </div>

  <div id="bottom">
    <div id="progress">
      <div id="track"><div id="played"></div><div id="chapters"></div></div>
      <div id="thumb"></div>
      <div id="tip"></div>
      <div id="preview"><img id="preview-img"></div>
    </div>
    <div id="row">
      <div id="group" class="chip">
        <div id="btn-prev" class="btn"><div class="ico i-prev"></div></div>
        <div id="btn-play" class="btn"><div class="ico i-play"></div></div>
        <div id="btn-next" class="btn"><div class="ico i-next"></div></div>
      </div>
      <div id="vol" class="chip">
        <div id="btn-mute" class="btn"><div class="ico i-vol"></div></div>
        <div id="vol-slider"><div id="vol-track"><div id="vol-fill"></div></div><div id="vol-thumb"></div></div>
      </div>
      <div id="time" class="chip"></div>
      <div class="spacer"></div>
      <div id="btn-sub" class="btn chip"><div class="ico i-sub"></div></div>
      <div id="btn-set" class="btn chip"><div class="ico i-set"></div></div>
      <div id="btn-list" class="btn chip"><div class="ico i-list"></div></div>
    </div>
  </div>

  <div id="info">
    <div class="row"><div class="k">File</div><div id="iv0" class="v"></div></div>
    <div class="row"><div class="k">Format</div><div id="iv1" class="v"></div></div>
    <div class="row"><div class="k">Time</div><div id="iv2" class="v"></div></div>
    <div class="row"><div class="k">Video</div><div id="iv3" class="v"></div></div>
    <div class="row"><div class="k">Decoder</div><div id="iv4" class="v"></div></div>
    <div class="row"><div class="k">Audio</div><div id="iv5" class="v"></div></div>
    <div class="row"><div class="k">Subtitle</div><div id="iv6" class="v"></div></div>
    <div class="row"><div class="k">Sync</div><div id="iv7" class="v"></div></div>
    <div class="row"><div class="k">Volume</div><div id="iv8" class="v"></div></div>
  </div>
</div>
</body>
</html>
